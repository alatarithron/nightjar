name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # shellcheck is preinstalled on ubuntu-latest; bin/check.sh runs it when
      # present and skips it otherwise, so this is the same command that runs
      # on a laptop. There is deliberately no second source of truth here.
      - name: Run checks
        run: bin/check.sh

  reference-freshness:
    # docs/thunderbird-tokens.md is generated from an installed Thunderbird,
    # which the runner does not have. This job only proves the generated file
    # was not hand-edited into an inconsistent state.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reference is generated, not hand-written
        run: |
          set -euo pipefail
          head -5 docs/thunderbird-tokens.md | grep -q 'Generated by `bin/dump-tb-reference.sh`' \
            || { echo "docs/thunderbird-tokens.md lost its generation header"; exit 1; }
          grep -q '^--icon-' docs/thunderbird-tokens.md \
            || { echo "reference contains no icon properties"; exit 1; }
          echo "reference looks generated"
